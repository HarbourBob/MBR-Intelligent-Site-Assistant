name: Build release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set slug and version
        run: |
          echo "SLUG=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Check plugin header matches tag
        run: |
          HEADER=$(grep -m1 "^ \* Version:" ${{ env.SLUG }}.php | awk '{print $3}')
          if [ "$HEADER" != "${{ env.VERSION }}" ]; then
            echo "Header $HEADER does not match tag ${{ env.VERSION }}"
            exit 1
          fi

      - name: Build zip
        run: |
          mkdir -p build/${{ env.SLUG }}
          rsync -a --exclude-from=.distignore ./ build/${{ env.SLUG }}/
          cd build && zip -r ../${{ env.SLUG }}.zip ${{ env.SLUG }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SLUG }}.zip
          generate_release_notes: true
